name: CI

on:
  push:
    branches:
      - master
      - codex/**
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ui-service/requirements.txt
            llm-service/requirements.txt
            rag-service/requirements.txt
            ingestion-service/requirements.txt
            ocr-service/requirements.txt
            asr-service/requirements.txt
            tts-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r rag-service/requirements.txt
          pip install -r ingestion-service/requirements.txt
          pip install -r ocr-service/requirements.txt
          pip install -r asr-service/requirements.txt
          pip install -r tts-service/requirements.txt

      - name: Run tests
        run: pytest -q
