services:

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_ui}
      POSTGRES_USER: ${POSTGRES_USER:-rag_ui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_ui} -d ${POSTGRES_DB:-rag_ui}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  vllm-service:
    image: vllm/vllm-openai:v0.6.6.post1
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=1
    command:
      - ${VLLM_HF_MODEL:-AMead10/Llama-3.2-3B-Instruct-AWQ}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-llama3.2:3b-instruct}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-16}
      - --attention-backend
      - FLASHINFER
      - --enforce-eager
      - --enable-prefix-caching
    gpus: all
    ipc: host
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  unlimited-ocr-model:
    image: vllm/vllm-openai:unlimited-ocr
    profiles: ["ocr"]
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=1
    command:
      - baidu/Unlimited-OCR
      - --trust-remote-code
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
    gpus: all
    ipc: host
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  ocr-service:
    build: ./ocr-service
    profiles: ["ocr"]
    env_file:
      - .env
    depends_on:
      unlimited-ocr-model:
        condition: service_healthy
    environment:
      - OCR_MODEL_URL=http://unlimited-ocr-model:8000/v1/chat/completions
      - OCR_MODEL_NAME=${OCR_MODEL_NAME:-baidu/Unlimited-OCR}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-20}
      - OCR_RENDER_DPI=${OCR_RENDER_DPI:-150}
      - OCR_MAX_TOKENS=${OCR_MAX_TOKENS:-32768}
      - OCR_REQUEST_TIMEOUT=${OCR_REQUEST_TIMEOUT:-1200}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  asr-service:
    build: ./asr-service
    profiles: ["voice"]
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - ASR_MODEL=${ASR_MODEL:-small}
      - ASR_DEVICE=${ASR_DEVICE:-cuda}
      - ASR_COMPUTE_TYPE=${ASR_COMPUTE_TYPE:-float16}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  cosyvoice-service:
    build:
      context: ./cosyvoice-service
      args:
        COSYVOICE_REF: ${COSYVOICE_REF:-main}
    profiles: ["voice"]
    environment:
      - COSYVOICE_MODEL=${COSYVOICE_MODEL:-iic/CosyVoice-300M-SFT}
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50000/docs', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  tts-service:
    build: ./tts-service
    profiles: ["voice"]
    env_file:
      - .env
    volumes:
      - tts_data:/app/data
    depends_on:
      cosyvoice-service:
        condition: service_healthy
    environment:
      - COSYVOICE_URL=http://cosyvoice-service:50000
      - TTS_SAMPLE_RATE=${TTS_SAMPLE_RATE:-22050}
      - TTS_REQUEST_TIMEOUT=${TTS_REQUEST_TIMEOUT:-300}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  embedding-service:
    build: ./embedding-service
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    environment:
      - EMBEDDING_CONCURRENCY=4
      - EMBEDDING_BATCH_SIZE=32
      - EMBEDDING_WORKERS=1
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  llm-service:
    build: ./llm-service
    env_file:
      - .env
    depends_on:
      - redis
      - vllm-service
    environment:
      - REQUEST_TIMEOUT=300
      - LLM_CONCURRENCY=4
      - LLM_WORKERS=1
      - OLLAMA_KEEP_ALIVE=30m
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm-service:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-llama3.2:3b-instruct}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    env_file:
      - .env
    depends_on:
      embedding-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - LLM_SERVICE_URL=http://llm-service:8002/generate
      - VECTOR_SERVICE_URL=http://embedding-service:8001
      - REQUEST_TIMEOUT=60
      - RAG_WORKERS=4
      - RAG_LLM_CONCURRENCY=8
      - RAG_VECTOR_CONCURRENCY=32
      - RAG_CACHE_TTL=1800
      - RAG_SEARCH_CANDIDATES=12
      - RAG_FINAL_TOP_K=${RAG_FINAL_TOP_K:-3}
      - RAG_MAX_CONTEXT_CHARS=${RAG_MAX_CONTEXT_CHARS:-2500}
      - RAG_MAX_ANSWER_TOKENS=${RAG_MAX_ANSWER_TOKENS:-256}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ingestion-service:
    build: ./ingestion-service
    env_file:
      - .env
    depends_on:
      embedding-service:
        condition: service_healthy
    environment:
      - INGESTION_WORKERS=2
      - INGESTION_HTTP_MAX_CONNECTIONS=100
      - INGESTION_HTTP_MAX_KEEPALIVE=20
      - OCR_ENABLED=${OCR_ENABLED:-false}
      - OCR_SERVICE_URL=${OCR_SERVICE_URL:-http://ocr-service:8006/extract}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  zup-service:
    build: ./zup-service
    env_file:
      - .env
    environment:
      - ZUP_API_BASE_URL=${ZUP_API_BASE_URL:-}
      - ZUP_EMPLOYEES_PATH=${ZUP_EMPLOYEES_PATH:-/employees}
      - ZUP_SEARCH_PARAM=${ZUP_SEARCH_PARAM:-q}
      - ZUP_API_TOKEN=${ZUP_API_TOKEN:-}
      - ZUP_AUTH_HEADER=${ZUP_AUTH_HEADER:-Authorization}
      - ZUP_REQUEST_TIMEOUT=${ZUP_REQUEST_TIMEOUT:-30}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ui-service:
    build: ./ui-service
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ui_data:/app/data
    environment:
      - REQUEST_TIMEOUT=60
      - UI_WORKERS=1
      - UI_HTTP_MAX_CONNECTIONS=200
      - UI_HTTP_MAX_KEEPALIVE=50
      - ASR_SERVICE_URL=${ASR_SERVICE_URL:-http://asr-service:8007}
      - TTS_SERVICE_URL=${TTS_SERVICE_URL:-http://tts-service:8008}
      - ZUP_SERVICE_URL=${ZUP_SERVICE_URL:-http://zup-service:8009}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
    depends_on:
      rag-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      zup-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    
  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  postgres_data:
  hf_cache:
  ui_data:
  tts_data:
